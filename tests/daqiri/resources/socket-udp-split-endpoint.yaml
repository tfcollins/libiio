# Software-only endpoint independence test. Management stays on 127.0.0.1;
# the emulator's data sender binds 127.0.0.2:25102. Linux loopback routes all
# of 127/8 locally, so this needs no network configuration or NIC access.
daqiri:
  cfg:
    version: 1
    stream_type: socket
    master_core: 0
    memory_regions:
    - name: HOST_MR
      kind: host
      affinity: 0
      num_bufs: 256
      buf_size: 2048
    interfaces:
    - name: data
      address: 127.0.0.1
      socket_config:
        mode: server
        local_addr: 'udp://127.0.0.1:25101'
        remote_addr: 'udp://127.0.0.2:25102'
        max_payload_size: 1472
      rx:
        queues:
        - name: rx0
          id: 0
          cpu_core: 0
          batch_size: 8
          memory_regions:
          - HOST_MR
