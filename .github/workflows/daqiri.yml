name: DAQIRI backend
permissions:
  contents: read

on: [push, pull_request]

jobs:
  software:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tfcollins/libiio-daqiri-ci:latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build \
            -DWITH_MODULES=ON -DWITH_DAQIRI_BACKEND=ON -DWITH_TESTS=ON \
            -DWITH_EMU_BACKEND=ON -DWITH_EMU_BACKEND_DYNAMIC=OFF \
            -DWITH_IIOD_EMU=ON -DWITH_GCOV=OFF \
            -DCUDAToolkit_ROOT=/usr/local/cuda \
            -DIIO_MODULES_DIR_OVERRIDE=$GITHUB_WORKSPACE/build/
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build -L '^daqiri$' --output-on-failure
      - name: Loopback tests
        run: ctest --test-dir build -L daqiri-loopback -j1 --output-on-failure
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daqiri-testing
          path: build/Testing

  unit-no-daqiri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential libxml2-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -DWITH_TESTS=ON
          cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build -L daqiri --output-on-failure
